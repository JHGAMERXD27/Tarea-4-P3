<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario - CRUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sección de Login -->
    <div class="container" id="login-section">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Usuario" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit" id="login-btn">Entrar</button>
        </form>
        <p id="login-error" style="color: red; display: none;">Credenciales incorrectas</p>
    </div>

    <!-- Sección CRUD (Oculta por defecto) -->
    <div class="container" id="crud-section" style="display: none;">
        <h2>Gestión de Usuarios <a id="report-link" href="mochawesome-report/mochawesome.html" target="_blank" style="font-size:0.8em; margin-left:10px; text-decoration:none; padding:6px 10px; background:#007bff; color:#fff; border-radius:4px;">Ver reporte</a></h2>
        
        <form id="crud-form">
            <input type="hidden" id="user-id">
            <input type="text" id="user-name" placeholder="Nombre completo" required>
            <input type="email" id="user-email" placeholder="Correo electrónico" required>
            <button type="submit" id="save-btn">Guardar Usuario</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="user-list">
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
